name: Deploy DeCA to MonsterASP.NET

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DeCa.csproj

      - name: Publish Release
        run: dotnet publish DeCa.csproj -c Release -o ./publish --no-restore

      - name: Create app_offline.htm
        run: |
          mkdir -p ./offline
          echo '<html><body>DeCA is updating. Please try again shortly.</body></html>' > ./offline/app_offline.htm

      - name: Stop DeCA temporarily
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from ftplib import FTP

          ftp = FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.cwd("/wwwroot")

          with open("./offline/app_offline.htm", "rb") as f:
              ftp.storbinary("STOR app_offline.htm", f)

          ftp.quit()

          print("DeCA is now offline.")
          print("Waiting 10 seconds for IIS to release files...")
          time.sleep(10)
          print("Ready to deploy.")
          PY

      - name: Deploy to MonsterASP.NET
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: /wwwroot/
          dangerous-clean-slate: false

      - name: Start DeCA again
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          from ftplib import FTP, error_perm

          ftp = FTP()
          ftp.connect(os.environ["FTP_SERVER"], 21, timeout=30)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.cwd("/wwwroot")

          try:
              ftp.delete("app_offline.htm")
              print("app_offline.htm removed. DeCA can start again.")
          except error_perm as e:
              if not str(e).startswith("550"):
                  raise
              print("app_offline.htm was not present.")

          ftp.quit()
          PY
